<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ajouter une tâche - TPSB</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav>
    <span class="logo">✔ TPSB Tasks</span>
    <a href="index.html">Mes tâches</a>
    <a href="ajouter.html" class="active">Ajouter une tâche</a>
  </nav>
  <main>
    <h1 id="page-title">Ajouter une tâche</h1>
    <p id="message" class="message"></p>
    <form id="task-form" class="card">
      <div>
        <label for="title">Titre</label>
        <input type="text" id="title" name="title" maxlength="100" required>
      </div>
      <div>
        <label for="description">Description</label>
        <textarea id="description" name="description" maxlength="255"></textarea>
      </div>
      <div class="row">
        <input type="checkbox" id="completed" name="completed" class="check">
        <label for="completed">Tâche déjà terminée</label>
      </div>
      <div class="actions">
        <button type="submit" class="btn primary">Enregistrer</button>
        <a href="index.html" class="btn secondary">Annuler</a>
      </div>
    </form>
  </main>
  <script>
    const API = "/api/tasks";
    const taskId = new URLSearchParams(window.location.search).get("id");
    const form = document.getElementById("task-form");
    const msg = document.getElementById("message");

    function show(text, type) {
      msg.textContent = text;
      msg.className = "message " + type;
    }

    async function loadTask() {
      try {
        const res = await fetch(API + "/" + encodeURIComponent(taskId));
        if (!res.ok) {
          throw new Error("HTTP " + res.status);
        }
        const task = await res.json();
        document.getElementById("title").value = task.title;
        document.getElementById("description").value = task.description || "";
        document.getElementById("completed").checked = task.completed;
      } catch (error) {
        console.error(error);
        show("Tâche introuvable.", "error");
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const body = {
        title: document.getElementById("title").value.trim(),
        description: document.getElementById("description").value.trim(),
        completed: document.getElementById("completed").checked
      };
      const url = taskId ? API + "/" + encodeURIComponent(taskId) : API;
      const method = taskId ? "PUT" : "POST";
      try {
        const res = await fetch(url, {
          method: method,
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body)
        });
        if (!res.ok) {
          throw new Error("HTTP " + res.status);
        }
        show(taskId ? "Tâche modifiée ✔" : "Tâche ajoutée ✔", "ok");
        setTimeout(() => { window.location.href = "index.html"; }, 800);
      } catch (error) {
        console.error(error);
        show("Erreur lors de l'enregistrement.", "error");
      }
    });

    if (taskId) {
      document.getElementById("page-title").textContent = "Modifier la tâche";
      document.title = "Modifier la tâche - TPSB";
      loadTask();
    }
  </script>
</body>
</html>
